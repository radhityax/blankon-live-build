-i mirror/protocol string http
d-i mirror/country string manual
d-i mirror/http/hostname string arsip-dev.blankonlinux.id
d-i mirror/http/directory string /sinambung
d-i mirror/suite string sinambung
d-i mirror/udeb/suite string sinambung
d-i mirror/http/proxy string

d-i apt-setup/services-select multiselect
d-i apt-setup/security_host string arsip-dev.blankonlinux.id
d-i apt-setup/security_path string /sinambung
d-i apt-setup/use_mirror boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-mounted boolean false

d-i debian-installer/allow_unauthenticated boolean true

tasksel tasksel/first multiselect gnome-desktop
d-i pkgsel/run_tasksel boolean true
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none

d-i pkgsel/include string praya-service praya-gnome-shell-extension tilingshell-gnome-shell-extension no-overview-gnome-shell-extension appindicator-gnome-shell-extension ptyxis adwaita-qt adwaita-qt6 gedit audacious vlc fprintd libpam-fprintd fonts-noto-core task-indonesian-desktop task-indonesian

d-i preseed/late_command string apt-install libglib2.0-bin; cp /cdrom/preseed/90_blankon.gschema.override /target/usr/share/glib-2.0/schemas/; in-target glib-compile-schemas /usr/share/glib-2.0/schemas; in-target apt-get -y update; in-target apt-get -y install --no-install-recommends praya-service praya-gnome-shell-extension tilingshell-gnome-shell-extension no-overview-gnome-shell-extension appindicator-gnome-shell-extension ptyxis adwaita-qt adwaita-qt6 gedit audacious vlc fprintd libpam-fprintd task-indonesian-desktop task-indonesian
